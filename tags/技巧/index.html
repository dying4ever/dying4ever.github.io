></i>归档</a></li><li class="item"><a href="/friends/" rel="section"><i class="ic i-heart"></i>友链</a></li></div></div><script>(() => {
  const nodes = document.querySelectorAll('.sidebar-typing');
  nodes.forEach((node) => {
    if (node.dataset.ready === 'true') return;
    node.dataset.ready = 'true';
    const textNode = node.querySelector('.typing-text');
    const words = (node.dataset.words || 'Por Una Cabeza').split('|').filter(Boolean);
    if (!textNode || words.length < 1) return;
    let wordIndex = 0;
    let charIndex = 0;
    let deleting = false;
    let hold = 0;
    const tick = () => {
      const word = words[wordIndex % words.length];
      textNode.textContent = deleting ? word.slice(0, charIndex--) : word.slice(0, charIndex++);
      if (!deleting && charIndex > word.length) {
        if (hold < 42) {
          hold++;
          window.setTimeout(tick, 200);
          return;
        }
        hold = 0;
        deleting = true;
      }
      if (deleting && charIndex < 0) {
        deleting = false;
        wordIndex++;
        charIndex = 0;
      }
      window.setTimeout(tick, deleting ? 170 : 220);
    };
    tick();
  });
})();</script></div></div></div><ul id="quick"><li class="prev pjax"></li><li class="up"><i class="ic i-arrow-up"></i></li><li class="down"><i class="ic i-arrow-down"></i></li><li class="next pjax"></li><li class="percent"></li></ul></div></div><div class="dimmer"></div></div><div id="player"></div></main><footer id="footer"><div class="inner"><div class="widgets"><div class="rpost pjax"><h2>最新评论</h2></div></div><div class="status"><div class="copyright">© 2025 -<span itemprop="copyrightYear">2026</span><span class="with-love"><i class="ic i-sakura rotate"></i></span><span class="author" itemprop="copyrightHolder">曾阿牛 @ Frostbitten Carpe Diem</span></div><div class="count"><span class="post-meta-item-icon"><i class="ic i-chart-area"></i></span><span title="站点总字数">963k 字</span><span class="post-meta-divider"> | </span><span class="post-meta-item-icon"><i class="ic i-coffee"></i></span><span title="站点阅读时长">14:35</span></div><div class="powered-by">基于 <a target="_blank" rel="noopener" href="https://hexo.io/">Hexo</a> &amp; Theme.<a target="_blank" rel="noopener" href="https://github.com/theme-shoka-x/hexo-theme-shokaX/">ShokaX</a></div></div></div></footer></div><script data-config="" type="text/javascript">var LOCAL = {
